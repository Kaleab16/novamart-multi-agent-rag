[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "novamart-rag"
version = "0.1.0"
description = "NovaMart multi-agent e-commerce RAG application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "strands-agents>=1.0,<2",
    "bedrock-agentcore>=1.0,<2",
    "pymongo>=4.19,<5",
    "dnspython>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
